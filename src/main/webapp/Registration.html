<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Student Registration Form</title>

<style>
body {
	font-family: Arial, sans-serif;
	background-color: #f2f2f2;
}

.container {
	width: 500px;
	margin: 50px auto;
	padding: 20px;
	background-color: white;
	border-radius: 10px;
	box-shadow: 0px 0px 5px gray;
}

h2 {
	text-align: center;
	color: navy;
}
input, select {
	width: 90%;
	padding: 8px;
	margin-top: 5px;
	margin-bottom: 10px;
}

input[type="radio"] {
	width: auto;
	margin-right: 5px;
}

.btn {
	background-color: green;
	color: white;
	border: none;
	padding: 10px;
	width: 100%;
	cursor: pointer;
}

.btn:hover {
	background-color: darkgreen;
}
</style>

</head>
<body>

	<div class="container">

		<h2> * Student Registration Form *</h2>

		<form action="RegistrationServlet" method="post">

			<label>First Name</label> <input type="text" name="fname" required>

			<label>Last Name</label> <input type="text" name="lname" required>

			<label>Email</label> <input type="email" name="email" required>

			<label>Password</label> <input type="password" name="password"
				required> <label>Gender</label><br> <input type="radio"
				name="gender" value="Male"> Male <input type="radio"
				name="gender" value="Female"> Female <br> <br> <label>Course</label>
			<select name="course">
				<option>BCA</option>
				<option>BSc</option>
				<option>BTech</option>
				<option>MCA</option>
			</select> <label>Mobile Number</label> <input type="tel" name="mobile">

			<input type="submit" value="Register" class="btn">

		</form>

	</div>

</body>
</html>
